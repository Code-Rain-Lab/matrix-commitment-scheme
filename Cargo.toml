[package]
name = "matrix-commitment-scheme"
version = "0.1.0"
edition = "2024"

[dependencies]
ark-ff = "0.5.0"
ark-std = "0.5.0"
sha2 = "0.10"
ark-crypto-primitives = { version = "0.5.0", features = ["sponge", "r1cs"] }
ark-test-curves = { version = "0.5.0", features = ["bls12_381_scalar_field"] }
rayon = "1.10"
itertools = "0.14.0"
num-traits = "0.2.19"
waseki = {git = "https://github.com/ClankPan/waseki"}

[dev-dependencies]
ark-bn254 = "0.5.0"
ark-std = "0.5.0"
criterion = "0.5"

[[bench]]
name = "commit_bench"
harness = false
